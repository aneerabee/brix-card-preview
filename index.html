<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BRIX — Quote Card V7.5</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --paper: oklch(98.4% 0.007 84);
      --canvas: oklch(95.7% 0.014 82);
      --ink: oklch(22% 0.025 63);
      --muted: oklch(43.5% 0.022 64);
      --line: oklch(82% 0.02 78);
      --line-soft: oklch(89% 0.014 80);
      --pine-950: oklch(22% 0.055 158);
      --pine-850: oklch(29% 0.07 158);
      --pine-650: oklch(41% 0.085 158);
      --pine-100: oklch(92.5% 0.035 158);
      --cream: oklch(93% 0.065 88);
      --gold: oklch(57% 0.13 78);
      --gold-soft: oklch(94% 0.05 85);
      --red: oklch(49% 0.19 28);
      --red-soft: oklch(94% 0.048 28);
      --blue: oklch(49% 0.095 238);
      --blue-soft: oklch(93% 0.035 238);
      --plum: oklch(46% 0.1 318);
      --plum-soft: oklch(94% 0.03 318);
      --space-2xs: 2px;
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 12px;
      --space-lg: 16px;
      --space-xl: 24px;
      --text-2xs: .5625rem;
      --text-xs: .625rem;
      --text-sm: .6875rem;
      --text-md: .75rem;
      --text-lg: .875rem;
      --text-title: 1.0625rem;
      --text-price: 2rem;
      --weight-medium: 500;
      --weight-semibold: 600;
      --weight-bold: 700;
      --weight-extrabold: 800;
      --font-ui: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-display: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --font-data: "Fira Code", "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
      --duration-fast: 120ms;
      --duration-state: 260ms;
      --duration-enter: 460ms;
      --ease-out: cubic-bezier(.16, 1, .3, 1);
      --ease-toggle: cubic-bezier(.65, 0, .35, 1);
    }

    * { box-sizing: border-box; }

    html { background: var(--canvas); }

    body {
      min-width: 320px;
      margin: 0;
      background:
        linear-gradient(90deg, transparent 31px, color-mix(in oklch, var(--line) 42%, transparent) 32px, transparent 33px) 0 0 / 48px 48px,
        var(--canvas);
      color: var(--ink);
      font-family: var(--font-ui);
      font-size: 1rem;
      line-height: 1.45;
      font-kerning: normal;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; }

    button:focus-visible {
      outline: 3px solid color-mix(in oklch, var(--blue) 65%, var(--paper));
      outline-offset: 2px;
    }

    .lab-head {
      background: var(--pine-950);
      color: var(--paper);
      border-bottom: 2px solid var(--gold);
    }

    .lab-head__inner,
    .workspace {
      width: min(1160px, calc(100% - 24px));
      margin-inline: auto;
    }

    .lab-head__inner {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: var(--space-xl);
      padding: var(--space-md) 0;
    }

    .eyebrow,
    .scenario-head,
    .status-word,
    .period-month,
    .dock-label,
    .signal-label,
    .group-title {
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .eyebrow {
      display: block;
      color: var(--cream);
      font-size: var(--text-xs);
      font-weight: var(--weight-bold);
    }

    .lab-head h1 {
      margin: 2px 0 0;
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: var(--weight-bold);
      line-height: 1.05;
      letter-spacing: -.035em;
    }

    .workspace { padding: var(--space-lg) 0 48px; }

    .scenario-head {
      display: flex;
      justify-content: space-between;
      gap: var(--space-md);
      margin-bottom: 5px;
      color: var(--muted);
      font-size: var(--text-xs);
      font-weight: var(--weight-semibold);
    }

    .scenario-strip {
      display: flex;
      gap: var(--space-sm);
      overflow-x: auto;
      padding: var(--space-2xs) var(--space-2xs) var(--space-md);
      scrollbar-width: thin;
    }

    .scenario {
      flex: 0 0 auto;
      min-height: 35px;
      display: inline-flex;
      align-items: center;
      gap: var(--space-sm);
      padding: var(--space-xs) var(--space-md) var(--space-xs) var(--space-xs);
      background: color-mix(in oklch, var(--paper) 94%, transparent);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 999px;
      cursor: pointer;
      font-size: var(--text-sm);
      font-weight: var(--weight-semibold);
      white-space: nowrap;
      transition: transform var(--duration-fast) var(--ease-out), background var(--duration-fast), color var(--duration-fast), border-color var(--duration-fast);
    }

    .scenario:hover { transform: translateY(-1px); }
    .scenario:active { transform: translateY(1px) scale(.98); }

    .scenario[aria-pressed="true"] {
      background: var(--pine-950);
      color: var(--paper);
      border-color: var(--pine-950);
    }

    .scenario__number {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      background: var(--canvas);
      color: var(--ink);
      border-radius: 50%;
      font-size: var(--text-xs);
      font-weight: var(--weight-semibold);
      font-variant-numeric: tabular-nums;
    }

    #preview { container-type: inline-size; }

    .set-context {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: var(--space-md) var(--space-xl);
      margin-bottom: var(--space-sm);
      padding: var(--space-sm) var(--space-md);
      background: color-mix(in oklch, var(--paper) 92%, var(--pine-100));
      border-block: 1px solid var(--line);
      border-inline-start: 3px solid var(--pine-650);
    }

    .set-context__main,
    .set-context__title,
    .set-context__meta,
    .set-context__window {
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .set-context__main { gap: var(--space-md); }
    .set-context__copy { min-width: 0; }
    .set-context__title { flex-wrap: wrap; gap: var(--space-xs) var(--space-sm); }

    .set-context__title h2 {
      min-width: 0;
      margin: 0;
      overflow-wrap: anywhere;
      font-family: var(--font-display);
      font-size: var(--text-title);
      line-height: 1.05;
      letter-spacing: -.018em;
    }

    .set-context__sticker {
      flex: 0 0 auto;
      padding: 3px 8px;
      background: var(--red);
      color: var(--paper);
      box-shadow: 2px 2px 0 color-mix(in oklch, var(--pine-950) 18%, transparent);
      font-family: var(--font-data);
      font-size: var(--text-xs);
      font-weight: var(--weight-bold);
      letter-spacing: .04em;
      transform: rotate(-2deg);
    }

    .set-context__stars { color: var(--gold); font-size: var(--text-xs); letter-spacing: .08em; }
    .set-context__meta { flex-wrap: wrap; gap: 3px var(--space-sm); margin-top: var(--space-xs); color: var(--muted); font-size: var(--text-xs); }

    .set-context__board {
      padding: 1px 6px;
      background: var(--pine-100);
      color: var(--pine-950);
      font-size: var(--text-2xs);
      font-weight: var(--weight-bold);
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .set-context__window {
      gap: var(--space-sm);
      padding-inline-start: var(--space-md);
      border-inline-start: 1px solid var(--line);
      color: var(--gold);
      font-family: var(--font-data);
      white-space: nowrap;
    }

    .set-context__window span { font-size: var(--text-2xs); font-weight: var(--weight-bold); letter-spacing: .08em; }
    .set-context__window b { color: var(--ink); font-size: var(--text-sm); }

    .result-card {
      --tone: var(--pine-650);
      --tone-soft: var(--pine-100);
      --corner-lg: 18px;
      --corner-sm: 5px;
      container-type: inline-size;
      position: relative;
      isolation: isolate;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 228px;
      grid-template-areas:
        "main dock"
        "drawer drawer";
      overflow: clip;
      background: var(--paper);
      border: 1px solid color-mix(in oklch, var(--tone) 34%, var(--line));
      border-radius: var(--corner-lg) var(--corner-sm) var(--corner-lg) var(--corner-sm);
      box-shadow:
        0 0 0 1px color-mix(in oklch, var(--tone) 10%, transparent),
        0 14px 34px color-mix(in oklch, var(--pine-950) 8%, transparent);
      transition: transform 240ms var(--ease-out), box-shadow 240ms var(--ease-out), border-color 180ms;
      animation: ticket-in var(--duration-enter) var(--ease-out) backwards;
    }

    .result-card::before,
    .result-card::after {
      content: "";
      position: absolute;
      z-index: 5;
      pointer-events: none;
    }

    .result-card::before {
      inset: 3px;
      border: 1px solid color-mix(in oklch, var(--tone) 18%, transparent);
      border-radius: calc(var(--corner-lg) - 3px) calc(var(--corner-sm) - 1px) calc(var(--corner-lg) - 3px) calc(var(--corner-sm) - 1px);
      opacity: .72;
    }

    .result-card::after {
      inset: 0;
      background:
        linear-gradient(90deg, var(--tone), var(--tone)) 15px 0 / 38px 2px no-repeat,
        linear-gradient(180deg, var(--tone), var(--tone)) 0 15px / 2px 26px no-repeat,
        linear-gradient(270deg, var(--tone), var(--tone)) calc(100% - 15px) 100% / 38px 2px no-repeat,
        linear-gradient(0deg, var(--tone), var(--tone)) 100% calc(100% - 15px) / 2px 26px no-repeat;
      opacity: .9;
      animation: frame-signature 620ms var(--ease-out) 140ms both;
    }

    @keyframes frame-signature {
      from { opacity: 0; transform: scale(.995); }
      to { opacity: .9; transform: scale(1); }
    }

    @media (hover: hover) and (pointer: fine) {
      .result-card:hover {
        transform: translateY(-2px);
        border-color: color-mix(in oklch, var(--tone) 62%, var(--line));
        box-shadow:
          0 0 0 1px color-mix(in oklch, var(--tone) 18%, transparent),
          0 18px 42px color-mix(in oklch, var(--pine-950) 11%, transparent);
      }
    }

    .scenario-head,
    .scenario__number,
    .party,
    .factor,
    .priced-party,
    .period-axis,
    .period-terms,
    .period-rate,
    .night,
    .dock-coverage,
    .dock-old,
    .dock-value,
    .dock-range,
    .dock-base,
    .margin-row,
    .group-count {
      font-family: var(--font-data);
      font-variant-ligatures: none;
    }

    .result-card[data-tone="warn"] { --tone: var(--gold); --tone-soft: var(--gold-soft); }
    .result-card[data-tone="block"] { --tone: var(--red); --tone-soft: var(--red-soft); }
    .result-card[data-tone="reference"],
    .result-card[data-tone="info"] { --tone: var(--blue); --tone-soft: var(--blue-soft); }
    .result-card[data-tone="adjusted"] { --tone: var(--plum); --tone-soft: var(--plum-soft); }

    @keyframes ticket-in {
      from { opacity: 0; transform: translateY(10px) scale(.992); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .card-main { grid-area: main; min-width: 0; }

    .result-head {
      min-height: 78px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: var(--space-lg);
      padding: var(--space-md) var(--space-lg) var(--space-sm);
    }

    .identity { min-width: 0; }

    .identity-heading[data-quiet="true"] {
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr);
      align-items: start;
      gap: var(--space-sm);
    }

    .identity-heading[data-quiet="true"] .status-line { margin: 0; }
    .identity[data-quiet="true"] .tag-row { margin-left: 28px; }
    .title-copy { min-width: 0; }

    .status-line {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      margin-bottom: var(--space-xs);
    }

    .state-beacon {
      position: relative;
      width: 20px;
      height: 20px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      background: var(--tone);
      color: var(--paper);
      clip-path: polygon(28% 0,72% 0,100% 28%,100% 72%,72% 100%,28% 100%,0 72%,0 28%);
      font-size: var(--text-xs);
      font-weight: var(--weight-extrabold);
      animation: beacon-arrive 520ms var(--ease-out) 120ms both;
    }

    .state-beacon::after {
      content: "";
      position: absolute;
      inset: -5px;
      border: 1px solid var(--tone);
      opacity: 0;
      clip-path: inherit;
    }

    .result-card[data-tone="block"] .state-beacon::after,
    .result-card[data-tone="warn"] .state-beacon::after {
      animation: beacon-ring 3.2s var(--ease-out) 820ms infinite;
    }

    @keyframes beacon-arrive {
      from { opacity: 0; transform: rotate(-18deg) scale(.65); }
      to { opacity: 1; transform: rotate(0) scale(1); }
    }

    @keyframes beacon-ring {
      0%, 8% { opacity: .5; transform: scale(.72); }
      24%, 100% { opacity: 0; transform: scale(1.28); }
    }

    .status-word {
      color: var(--tone);
      font-size: var(--text-xs);
      font-weight: var(--weight-bold);
    }

    .hotel-name {
      display: block;
      color: var(--muted);
      margin-bottom: var(--space-2xs);
      font-size: var(--text-xs);
      font-weight: var(--weight-medium);
      letter-spacing: .02em;
    }

    .room-name {
      max-width: 46ch;
      margin: 0;
      overflow-wrap: anywhere;
      font-family: var(--font-display);
      font-size: var(--text-title);
      font-weight: var(--weight-bold);
      line-height: 1.08;
      letter-spacing: -.018em;
      text-wrap: balance;
      text-transform: uppercase;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-xs);
      margin-top: var(--space-sm);
    }

    .tag {
      padding: var(--space-2xs) var(--space-sm);
      background: var(--pine-100);
      color: var(--pine-950);
      border-radius: 2px;
      font-size: var(--text-2xs);
      font-weight: var(--weight-bold);
      letter-spacing: .055em;
      text-transform: uppercase;
    }

    .tag__short { display: none; }

    .tag--best {
      position: relative;
      overflow: hidden;
      background: var(--pine-650);
      color: var(--paper);
    }

    .tag--best::after {
      content: "";
      position: absolute;
      inset: -30% auto -30% -35%;
      width: 20%;
      background: color-mix(in oklch, var(--paper) 50%, transparent);
      transform: skewX(-18deg);
      animation: best-sheen 860ms var(--ease-out) 680ms 1 both;
    }

    @keyframes best-sheen { to { transform: translateX(520%) skewX(-18deg); } }

    .tag--supplement {
      background: transparent;
      color: var(--gold);
      border: 1px solid color-mix(in oklch, var(--gold) 50%, var(--line));
    }

    .occupancy {
      max-width: 340px;
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      align-items: center;
      gap: var(--space-sm);
      padding-left: var(--space-lg);
      border-left: 1px solid var(--line);
      text-align: right;
    }

    .occupancy-copy { min-width: 0; }

    .occupancy-mark {
      width: 28px;
      height: 26px;
      overflow: visible;
      color: var(--tone);
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .occ-person {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: occupant-arrive 380ms var(--ease-out) calc(140ms + var(--person-i) * 70ms) both;
    }

    .occ-count-dot {
      transform-box: fill-box;
      transform-origin: center;
      animation: count-dot-in 220ms var(--ease-out) calc(300ms + var(--dot-i) * 30ms) both;
    }

    @keyframes occupant-arrive {
      from { opacity: 0; transform: translateY(4px) scale(.62); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes count-dot-in {
      from { opacity: 0; transform: scale(.2); }
      to { opacity: 1; transform: scale(1); }
    }

    .occupancy-label {
      display: block;
      color: var(--muted);
      font-size: var(--text-2xs);
      font-weight: var(--weight-bold);
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .party {
      display: block;
      margin-top: var(--space-2xs);
      font-size: var(--text-lg);
      font-weight: var(--weight-bold);
      line-height: 1.15;
    }

    .factor {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2xs);
      margin-left: 4px;
      padding: 1px 5px;
      background: color-mix(in oklch, var(--pine-100) 58%, transparent);
      color: var(--pine-650);
      border: 1px solid color-mix(in oklch, var(--pine-650) 45%, var(--line));
      border-radius: 999px;
      font-size: var(--text-2xs);
      font-style: normal;
      font-weight: var(--weight-semibold);
      line-height: 1;
    }

    .factor-mark { width: 11px; height: 8px; overflow: visible; }
    .factor-link { transform-origin: center; animation: factor-connect 360ms var(--ease-out) 380ms both; }

    @keyframes factor-connect {
      from { opacity: 0; transform: scaleX(.1); }
      to { opacity: 1; transform: scaleX(1); }
    }

    .priced-party {
      display: block;
      margin-top: var(--space-xs);
      color: var(--blue);
      font-size: var(--text-xs);
      font-weight: var(--weight-semibold);
    }

    .rate-map {
      --period-mobile-width: 10.5rem;
      --period-mobile-head: 48px;
      --period-mobile-night: 24px;
      --period-rate-column: 4.25rem;
      position: relative;
      padding: var(--space-sm) var(--space-lg) var(--space-md);
      border-top: 1px solid var(--line-soft);
      border-bottom: 1px solid var(--line-soft);
    }

    .rate-motion-mark {
      width: 22px;
      height: 14px;
      overflow: visible;
      color: var(--pine-650);
      stroke-linecap: square;
    }

    .rate-map > .rate-motion-mark {
      position: absolute;
      z-index: 1;
      inset-block-start: -7px;
      inset-inline-end: var(--space-lg);
      box-sizing: content-box;
      padding-inline: 5px;
      background: var(--paper);
    }

    .rate-unit-mark {
      position: absolute;
      z-index: 3;
      inset-block-start: -9px;
      inset-inline-end: var(--space-lg);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      box-sizing: content-box;
      padding-inline: 5px;
      background: var(--paper);
      color: var(--pine-650);
      font-family: var(--font-data);
      font-size: var(--text-2xs);
      font-weight: var(--weight-bold);
      line-height: 1;
      letter-spacing: .04em;
    }

    .rate-unit-mark .rate-motion-mark {
      width: 18px;
      height: 12px;
    }

    .rate-tick {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: rate-tick-in 330ms var(--ease-out) calc(160ms + var(--tick-i) * 70ms) both;
    }

    @keyframes rate-tick-in {
      from { opacity: 0; transform: translateY(3px) scaleY(.2); }
      to { opacity: 1; transform: translateY(0) scaleY(1); }
    }

    .rate-scroll {
      overflow-x: hidden;
      overscroll-behavior-inline: contain;
      scroll-snap-type: inline proximity;
      scroll-padding-inline: 1px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .rate-map[data-scrollable="true"] .rate-scroll { overflow-x: auto; }
    .rate-scroll::-webkit-scrollbar { display: none; }

    .rate-scroll-indicator {
      height: 2px;
      margin-top: var(--space-xs);
      overflow: hidden;
      background: var(--line-soft);
    }

    .rate-scroll-indicator[hidden] { display: none; }

    .rate-scroll-thumb {
      display: block;
      width: var(--thumb-width, 100%);
      height: 100%;
      background: var(--tone);
      transform: translateX(var(--thumb-offset, 0));
      transition: transform 80ms linear;
    }

    .rate-band {
      min-width: 100%;
      position: relative;
      display: flex;
      align-items: stretch;
      background: var(--paper);
      border: 1px solid var(--line);
    }

    .rate-period {
      --period: var(--pine-650);
      --period-soft: var(--pine-100);
      position: relative;
      flex: var(--span) 0 max(145px, calc(var(--span) * 30px));
      min-width: max(145px, calc(var(--span) * 30px));
      overflow: hidden;
      background: color-mix(in oklch, var(--period-soft) 66%, var(--paper));
      border-top: 2px solid var(--period);
      border-right: 1px solid var(--line);
      scroll-snap-align: start;
      animation: period-unfold 420ms var(--ease-out) calc(100ms + var(--i) * 70ms) both;
    }

    .rate-period:last-child { border-right-color: transparent; }
    .rate-period[data-period="2"] { --period: var(--gold); --period-soft: var(--gold-soft); }
    .rate-period[data-period="3"] { --period: var(--blue); --period-soft: var(--blue-soft); }
    .rate-period[data-period="4"] { --period: var(--plum); --period-soft: var(--plum-soft); }

    .rate-period[data-missing="true"] {
      --period: var(--gold);
      --period-soft: var(--gold-soft);
      background: repeating-linear-gradient(135deg, var(--paper) 0 7px, var(--period-soft) 7px 14px);
      border-top-style: dashed;
    }

    .rate-period[data-discount="true"] .period-head {
      background-image: repeating-linear-gradient(135deg, color-mix(in oklch, var(--period) 8%, transparent) 0 4px, transparent 4px 9px);
    }

    .rate-period[data-discount="true"]::before {
      content: "";
      position: absolute;
      z-index: 2;
      inset: 0 auto 0 -28%;
      width: 18%;
      pointer-events: none;
      background: color-mix(in oklch, var(--paper) 45%, transparent);
      transform: skewX(-16deg);
      animation: saving-scan 820ms var(--ease-out) calc(520ms + var(--i) * 80ms) 1 both;
    }

    @keyframes period-unfold {
      from { opacity: 0; transform: translateX(10px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes saving-scan { to { transform: translateX(720%) skewX(-16deg); } }

    .period-head {
      min-height: 46px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-areas:
        "axis rate"
        "terms terms";
      align-items: flex-start;
      gap: var(--space-xs) var(--space-sm);
      padding: var(--space-xs) var(--space-sm);
      border-bottom: 1px solid color-mix(in oklch, var(--period) 25%, var(--line-soft));
    }

    .rate-period[data-single="true"] .period-head {
      min-height: 24px;
      align-items: center;
      padding-block: 5px 3px;
    }

    .rate-period[data-single-discount="true"] .period-head {
      min-height: 44px;
      grid-template-columns: auto minmax(0, 1fr);
      grid-template-areas: "axis terms";
      align-items: center;
      gap: var(--space-lg);
      padding: var(--space-sm);
    }

    .rate-period[data-single-discount="true"] .period-terms {
      justify-self: stretch;
      justify-content: center;
      flex-wrap: nowrap;
      gap: var(--space-sm);
    }

    .period-origin-rate {
      display: inline-flex;
      align-items: center;
      gap: var(--space-xs);
      color: var(--muted);
      white-space: nowrap;
    }

    .period-origin-rate s {
      text-decoration-color: var(--red);
      text-decoration-thickness: 1.5px;
    }

    .period-origin-rate i {
      color: var(--period);
      font-style: normal;
      font-weight: var(--weight-bold);
    }

    .period-axis {
      grid-area: axis;
      min-height: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--period);
      font-size: var(--text-2xs);
      font-weight: var(--weight-bold);
      line-height: 1;
    }

    .period-night-count {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-weight: var(--weight-semibold);
      letter-spacing: 0;
    }

    .period-month + .period-night-count::before {
      content: "";
      width: 1px;
      height: 9px;
      background: color-mix(in oklch, var(--period) 40%, var(--line));
    }

    .period-terms {
      grid-area: terms;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-xs);
      margin-top: 0;
      color: var(--muted);
      font-size: var(--text-2xs);
      line-height: 1.1;
    }

    .period-discount {
      display: inline-flex;
      align-items: center;
      padding: var(--space-2xs) var(--space-sm);
      background: var(--period);
      color: var(--paper);
      box-shadow: 0 1px 0 color-mix(in oklch, var(--period) 45%, transparent);
      font-weight: var(--weight-bold);
      letter-spacing: .02em;
    }

    .period-discount::before {
      content: "↓";
      padding-right: var(--space-2xs);
      border-right: 1px solid color-mix(in oklch, var(--paper) 32%, transparent);
      font-size: var(--text-2xs);
      line-height: 1;
    }

    .period-discount small {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-inline-start: 5px;
      padding-inline-start: 5px;
      border-inline-start: 1px solid color-mix(in oklch, var(--paper) 34%, transparent);
      font-size: var(--text-2xs);
      font-weight: var(--weight-bold);
      letter-spacing: .04em;
    }

    .period-discount small i {
      padding: 1px 3px;
      background: color-mix(in oklch, var(--paper) 20%, transparent);
      font-style: normal;
    }

    .period-rate {
      grid-area: rate;
      inline-size: var(--period-rate-column);
      min-width: var(--period-rate-column);
      color: var(--period);
      text-align: right;
      white-space: nowrap;
    }

    .period-rate strong {
      display: block;
      font-size: 1rem;
      font-weight: var(--weight-extrabold);
      line-height: 1;
      letter-spacing: -.015em;
      font-variant-numeric: tabular-nums;
    }

    .period-rate .period-rate-old {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: var(--text-2xs);
      font-weight: var(--weight-semibold);
      line-height: 1;
    }

    .period-rate-old s {
      text-decoration-color: var(--red);
      text-decoration-thickness: 1.5px;
    }

    .period-rate-old[data-empty="true"] { visibility: hidden; }

    .night-line {
      display: grid;
      grid-template-columns: repeat(var(--span), minmax(25px, 1fr));
    }

    .night {
      min-height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-xs);
      color: var(--muted);
      border-right: 1px solid var(--line-soft);
      font-size: var(--text-2xs);
      font-weight: var(--weight-semibold);
      font-variant-numeric: tabular-nums;
      animation: night-arrive 300ms var(--ease-out) calc(240ms + var(--night-i) * 18ms) both;
    }

    .night:last-child { border-right: 0; }

    @keyframes night-arrive {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .night[data-state="stop"] {
      background: var(--red-soft);
      color: var(--red);
    }

    .stop-mark {
      position: relative;
      width: 13px;
      height: 13px;
      display: grid;
      place-items: center;
      background: var(--red);
      color: var(--paper);
      clip-path: polygon(28% 0,72% 0,100% 28%,100% 72%,72% 100%,28% 100%,0 72%,0 28%);
      font-size: var(--text-2xs);
      font-style: normal;
      font-weight: var(--weight-bold);
      animation: stop-beat 3.4s var(--ease-out) 400ms infinite;
    }

    @keyframes stop-beat {
      0%, 10%, 100% { transform: scale(1); }
      14% { transform: scale(.84); }
      21% { transform: scale(1.12); }
    }

    .signal-zone { padding: var(--space-sm) var(--space-lg) var(--space-md); }

    .signal-summary {
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-md);
      padding: var(--space-sm) var(--space-md);
      background: color-mix(in oklch, var(--tone-soft) 68%, var(--paper));
      border-left: 3px solid var(--tone);
      animation: signal-enter 360ms var(--ease-out) 260ms both;
    }

    @keyframes signal-enter {
      from { opacity: 0; transform: translateX(-8px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .signal-copy {
      min-width: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: var(--space-2xs) var(--space-sm);
    }

    .signal-label {
      color: var(--tone);
      font-size: var(--text-2xs);
      font-weight: var(--weight-bold);
    }

    .signal-title { font-size: var(--text-md); font-weight: var(--weight-bold); line-height: 1.2; }
    .signal-text { max-width: 70ch; color: var(--muted); font-size: var(--text-sm); line-height: 1.35; }

    .review-button {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      gap: var(--space-sm);
      padding: var(--space-xs) var(--space-md);
      background: var(--paper);
      color: var(--pine-950);
      border: 1px solid var(--pine-650);
      border-radius: 10px 3px 10px 3px;
      cursor: pointer;
      font-size: var(--text-xs);
      font-weight: var(--weight-bold);
      white-space: nowrap;
      transition: transform var(--duration-fast) var(--ease-out), background var(--duration-fast), border-color var(--duration-fast);
    }

    .review-button::after,
    .management-toggle::after {
      content: "";
      width: 5px;
      height: 5px;
      border-right: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      transform: translateY(-1px) rotate(45deg);
      transition: transform var(--duration-state) var(--ease-toggle);
    }

    .review-button[aria-expanded="true"]::after,
    .management-toggle[aria-expanded="true"]::after {
      transform: translateY(2px) rotate(225deg);
    }

    .review-button:active { transform: translateY(1px) scale(.985); }

    .signal-drawer,
    .management-panel {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 300ms var(--ease-toggle);
    }

    .signal-drawer {
      grid-area: drawer;
      background: var(--paper);
      border-top: 1px solid transparent;
      transition: grid-template-rows 300ms var(--ease-toggle), border-color var(--duration-fast);
    }

    .signal-drawer[data-open="true"] { border-top-color: var(--line-soft); }

    .signal-drawer[data-open="true"],
    .management-panel[data-open="true"] { grid-template-rows: 1fr; }

    .drawer-clip,
    .management-clip { min-height: 0; overflow: hidden; }

    .drawer-scroll {
      max-height: min(300px, 50vh);
      overflow: auto;
      padding: var(--space-md) var(--space-lg) var(--space-lg);
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
    }

    .signal-groups {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-lg) var(--space-xl);
    }

    .group-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-sm);
      padding-bottom: var(--space-xs);
      border-bottom: 1px solid var(--line);
    }

    .group-title {
      color: var(--group-color);
      font-size: var(--text-2xs);
      font-weight: var(--weight-bold);
    }

    .group-count {
      min-width: 19px;
      padding: 0 var(--space-xs);
      background: var(--group-color);
      color: var(--paper);
      text-align: center;
      font-size: var(--text-2xs);
      font-weight: var(--weight-bold);
    }

    .signal-item {
      display: grid;
      grid-template-columns: 17px minmax(0, 1fr);
      gap: var(--space-sm);
      padding: var(--space-sm) 0;
      border-bottom: 1px dashed var(--line-soft);
      font-size: var(--text-sm);
      line-height: 1.4;
    }

    .signal-symbol {
      width: 17px;
      height: 17px;
      display: grid;
      place-items: center;
      margin-top: 1px;
      background: var(--group-soft);
      color: var(--group-color);
      font-size: var(--text-2xs);
      font-weight: var(--weight-bold);
    }

    .signal-item b { font-weight: var(--weight-bold); }
    .signal-item span { color: var(--muted); }

    .signal-chips {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-xs);
      margin-top: var(--space-xs);
    }

    .signal-chip {
      max-width: 100%;
      padding: 2px 6px;
      overflow-wrap: anywhere;
      background: var(--group-soft);
      color: var(--group-color) !important;
      border: 1px solid color-mix(in oklch, var(--group-color) 35%, var(--line));
      border-radius: 6px 2px 6px 2px;
      font-family: var(--font-data);
      font-size: var(--text-2xs);
      font-weight: var(--weight-semibold);
    }

    .quote-dock {
      grid-area: dock;
      position: relative;
      min-width: 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      overflow: hidden;
      padding: var(--space-md) var(--space-md) var(--space-sm);
      background-color: var(--pine-950);
      background-image: repeating-linear-gradient(135deg, transparent 0 20px, color-mix(in oklch, var(--paper) 2.2%, transparent) 20px 21px);
      color: var(--paper);
      box-shadow: inset 0 3px 0 var(--tone);
      animation: dock-arrive var(--duration-enter) var(--ease-out) 60ms both;
    }

    .quote-dock::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 -4px;
      width: 8px;
      background: radial-gradient(circle, var(--paper) 0 2px, transparent 2.5px) center 8px / 8px 16px repeat-y;
      opacity: .95;
    }

    .quote-dock::after {
      content: "";
      position: absolute;
      inset: 8px;
      background:
        linear-gradient(90deg, var(--tone), var(--tone)) 100% 0 / 22px 2px no-repeat,
        linear-gradient(180deg, var(--tone), var(--tone)) 100% 0 / 2px 22px no-repeat,
        linear-gradient(270deg, var(--tone), var(--tone)) 100% 100% / 22px 2px no-repeat,
        linear-gradient(0deg, var(--tone), var(--tone)) 100% 100% / 2px 22px no-repeat;
      opacity: .82;
      pointer-events: none;
    }

    @keyframes dock-arrive {
      from { opacity: 0; transform: translateX(16px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .dock-label {
      display: block;
      color: color-mix(in oklch, var(--paper) 68%, var(--pine-950));
      font-size: var(--text-2xs);
      font-weight: var(--weight-bold);
      line-height: 1.1;
    }

    .dock-coverage {
      display: inline-flex;
      align-items: center;
      gap: var(--space-xs);
      margin-top: var(--space-xs);
      color: var(--cream);
      font-size: var(--text-xs);
      font-weight: var(--weight-semibold);
      line-height: 1.1;
    }

    .dock-segments {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--cream);
      font-size: var(--text-xs);
      line-height: 1.1;
    }

    .dock-segments .rate-motion-mark {
      width: 16px;
      height: 11px;
      color: currentColor;
    }

    .dock-segments strong {
      color: var(--paper);
      font-family: var(--font-data);
      font-size: var(--text-sm);
      font-weight: var(--weight-bold);
    }

    .dock-segments span {
      color: color-mix(in oklch, var(--paper) 68%, var(--pine-950));
      font-size: var(--text-2xs);
      font-weight: var(--weight-semibold);
    }

    .night-mark {
      width: 14px;
      height: 14px;
      overflow: visible;
      flex: 0 0 auto;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .night-crescent {
      transform-box: fill-box;
      transform-origin: center;
      animation: crescent-set 420ms var(--ease-out) 180ms both;
    }

    .night-spark {
      transform-box: fill-box;
      transform-origin: center;
      animation: night-spark-in 320ms var(--ease-out) 430ms both;
    }

    @keyframes crescent-set {
      from { opacity: 0; transform: rotate(-22deg) scale(.72); }
      to { opacity: 1; transform: rotate(0) scale(1); }
    }

    @keyframes night-spark-in {
      from { opacity: 0; transform: scale(.15) rotate(-18deg); }
      to { opacity: 1; transform: scale(1) rotate(0); }
    }

    .dock-summary { min-width: 0; }

    .dock-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--space-2xs) var(--space-sm);
    }

    .dock-old-inline {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2xs);
      color: color-mix(in oklch, var(--paper) 68%, var(--pine-950));
      font-size: var(--text-2xs);
      line-height: 1;
      white-space: nowrap;
    }

    .dock-old-inline s {
      color: var(--paper);
      text-decoration-color: var(--gold);
      text-decoration-thickness: 1.5px;
    }

    .dock-old-inline i {
      color: var(--cream);
      font-style: normal;
    }

    .dock-discount {
      display: inline-flex;
      align-items: center;
      gap: var(--space-xs);
      padding: var(--space-2xs) var(--space-sm);
      background: var(--cream);
      color: var(--pine-950);
      clip-path: polygon(0 0, calc(100% - 5px) 0, 100% 50%, calc(100% - 5px) 100%, 0 100%, 4px 50%);
      font-weight: var(--weight-bold);
      animation: discount-pop 420ms var(--ease-out) 320ms both;
    }

    .dock-discount strong {
      font-size: var(--text-md);
      font-weight: var(--weight-bold);
      line-height: 1;
    }

    .dock-discount small {
      padding-left: var(--space-xs);
      border-left: 1px solid color-mix(in oklch, var(--pine-950) 24%, transparent);
      font-size: var(--text-2xs);
      line-height: 1;
      letter-spacing: .04em;
    }

    @keyframes discount-pop {
      from { opacity: 0; transform: translateX(7px) scale(.9); }
      to { opacity: 1; transform: translateX(0) scale(1); }
    }

    .dock-value {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: var(--space-xs);
      margin-top: var(--space-sm);
      padding-bottom: var(--space-xs);
      animation: price-rise 480ms var(--ease-out) 180ms both;
    }

    .dock-price-stack { min-width: 0; }

    .dock-current {
      display: flex;
      align-items: baseline;
      gap: var(--space-xs);
    }

    .dock-value::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 34px;
      height: 1px;
      background: var(--tone);
      transform-origin: left;
      animation: price-rule 420ms var(--ease-out) 480ms both;
    }

    @keyframes price-rule {
      from { opacity: 0; transform: scaleX(.2); }
      to { opacity: 1; transform: scaleX(1); }
    }

    .dock-current strong {
      font-size: var(--text-price);
      font-weight: var(--weight-extrabold);
      line-height: .92;
      letter-spacing: -.035em;
      font-variant-numeric: tabular-nums;
    }

    .dock-current > span {
      color: color-mix(in oklch, var(--paper) 65%, var(--pine-950));
      font-size: var(--text-2xs);
      font-weight: var(--weight-medium);
    }

    @keyframes price-rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .dock-range {
      margin: var(--space-xs) 0 0;
      color: var(--cream);
      font-size: var(--text-xs);
      font-weight: var(--weight-semibold);
      font-variant-numeric: tabular-nums;
    }

    .dock-base {
      margin: var(--space-xs) 0 0;
      color: color-mix(in oklch, var(--paper) 62%, var(--pine-950));
      font-size: var(--text-2xs);
    }

    .management-toggle {
      min-height: 32px;
      display: inline-flex;
      align-items: center;
      gap: var(--space-sm);
      margin-top: var(--space-sm);
      padding: var(--space-xs) var(--space-sm);
      background: transparent;
      color: color-mix(in oklch, var(--paper) 82%, var(--pine-950));
      border: 1px solid color-mix(in oklch, var(--paper) 24%, var(--pine-950));
      border-radius: 9px 3px 9px 3px;
      cursor: pointer;
      font-size: var(--text-2xs);
      font-weight: var(--weight-semibold);
      transition: transform var(--duration-fast) var(--ease-out), background var(--duration-fast), border-color var(--duration-fast), color var(--duration-fast);
    }

    .management-toggle:active { transform: translateY(1px) scale(.985); }

    .margin-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-xs);
      padding-top: var(--space-sm);
      border-top: 1px solid color-mix(in oklch, var(--paper) 15%, var(--pine-950));
    }

    .margin-row span { display: block; opacity: .68; font-size: var(--text-2xs); font-weight: var(--weight-semibold); text-transform: uppercase; }
    .margin-row b { display: block; margin-top: var(--space-2xs); font-size: var(--text-xs); font-weight: var(--weight-bold); font-variant-numeric: tabular-nums; }

    .dock-actions { position: relative; z-index: 1; margin-top: var(--space-sm); }

    .copy-button {
      width: 100%;
      min-height: 42px;
      position: relative;
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) 28px;
      align-items: center;
      gap: var(--space-sm);
      padding: var(--space-sm);
      background: var(--cream);
      color: var(--pine-950);
      border: 1px solid color-mix(in oklch, var(--gold) 38%, var(--cream));
      border-radius: 12px 3px 12px 3px;
      box-shadow: 0 2px 0 color-mix(in oklch, var(--gold) 42%, transparent);
      cursor: pointer;
      font-size: var(--text-sm);
      font-weight: var(--weight-bold);
      transition: transform var(--duration-fast) var(--ease-out), background var(--duration-fast), border-color var(--duration-fast), box-shadow var(--duration-fast);
    }

    .copy-button::after { content: ""; grid-area: 1 / 3; width: 28px; height: 1px; }

    .copy-button::before {
      content: "✓";
      grid-area: 1 / 1;
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      background: var(--pine-650);
      color: var(--paper);
      border-radius: 9px 2px 9px 2px;
      font-size: var(--text-md);
      font-weight: var(--weight-extrabold);
      opacity: 0;
      transform: scale(.72) rotate(-8deg);
      transition: opacity 160ms, transform 220ms var(--ease-out);
    }

    .copy-button span {
      grid-area: 1 / 2;
      text-align: center;
      letter-spacing: -.01em;
    }

    .copy-button svg {
      grid-area: 1 / 1;
      width: 28px;
      height: 28px;
      padding: 7px;
      background: var(--pine-950);
      color: var(--cream);
      border-radius: 9px 2px 9px 2px;
      transition: opacity 140ms, transform 220ms var(--ease-out), background var(--duration-fast), color var(--duration-fast);
    }

    .copy-button:active { transform: translateY(1px) scale(.985); box-shadow: 0 1px 0 color-mix(in oklch, var(--gold) 34%, transparent); }
    .copy-button[data-copied="true"] {
      background: var(--pine-100);
      border-color: var(--pine-650);

    const groupMeta = {

    const tagMarkup = tag => `<span class="tag tag--${tag.kind}" aria-label="${tag.text}" title="${tag.text}"><span class="tag__full">${tag.text}</span><span class="tag__short" aria-hidden="true">${tag.short || tag.text}</span></span>`;

    function renderSetContext(context) {
      if (!context) return "";
      return `<section class="set-context" aria-label="Hotel result set context"><div class="set-context__main">${context.sticker ? `<span class="set-context__sticker" aria-label="${context.stickerLabel}">${context.sticker}</span>` : ""}<div class="set-context__copy"><div class="set-context__title"><h2>${context.hotel}</h2><span class="set-context__stars" aria-label="5 stars">${context.stars}</span></div><div class="set-context__meta"><span class="set-context__board">${context.board}</span><span>${context.area}</span><span>${context.rooms}</span></div></div></div><div class="set-context__window" aria-label="Special offer closes ${context.window}"><span>SPO</span><b>${context.window}</b></div></section>`;
    }

    function canonicalSignals(data) {
      return data.signals.filter(signal => signal.placement !== "rate");
    }

    function renderRateMap(data) {
      const pricedPeriods = data.periods.filter(period => period.price != null);
      const multiRate = pricedPeriods.length > 1;
      const multiSegment = data.periods.length > 1;
      const singleDiscount = data.periods.length === 1 && Boolean(pricedPeriods[0]?.discount);
      const discountRules = [...new Set(pricedPeriods.filter(period => period.discount && period.rule).map(period => period.rule))];
      const visibleRules = discountRules.slice(0, 2);
      const hiddenRuleCount = Math.max(0, discountRules.length - visibleRules.length);
      const seenRules = new Set();
      let nightIndex = 0;
      let previousMonth = "";
      const periods = data.periods.map((period, periodIndex) => {
        const stopped = new Set(period.stopDays || []);
        const monthMatches = period.dates.match(/\b(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\b/g) || [];
        const monthLabel = [...new Set(monthMatches)].join("→");
        const showMonth = Boolean(monthLabel && monthLabel !== previousMonth);
        if (monthLabel) previousMonth = monthLabel;
        const periodAxis = `<div class="period-axis">${showMonth ? `<span class="period-month">${monthLabel}</span>` : ""}${multiSegment ? `<span class="period-night-count">${period.days.length}N</span>` : ""}</div>`;
        const firstRuleOccurrence = Boolean(period.rule && !seenRules.has(period.rule));
        if (period.rule) seenRules.add(period.rule);
        const visibleRuleIndex = visibleRules.indexOf(period.rule);
        const ruleName = firstRuleOccurrence && visibleRuleIndex >= 0 ? period.rule : "";
        const moreRules = ruleName && visibleRuleIndex === visibleRules.length - 1 && hiddenRuleCount ? `<i aria-label="${hiddenRuleCount} more discount rule${hiddenRuleCount === 1 ? "" : "s"}">+${hiddenRuleCount}</i>` : "";
        const discountName = ruleName ? `<small>${ruleName}${moreRules}</small>` : "";
        const terms = period.missing
          ? `<span>Outside contract</span>`
          : period.discount
            ? multiRate
              ? `<span class="period-discount"><strong>−${period.discount}%</strong>${discountName}</span><span class="period-pp">€${period.pp}/pp</span>`
              : singleDiscount
                ? `${period.old ? `<span class="period-origin-rate"><s>€${period.old}</s><i aria-hidden="true">→</i></span>` : ""}<span class="period-discount"><strong>−${period.discount}%</strong>${discountName}</span>`
                : ""
            : multiRate ? `<span class="period-pp">€${period.pp}/pp</span>` : "";
        const oldRate = period.discount && period.old
          ? `<span class="period-rate-old"><s>€${period.old}</s></span>`
          : `<span class="period-rate-old" data-empty="true" aria-hidden="true">&nbsp;</span>`;
        const rate = period.missing
          ? `<div class="period-rate">${multiRate ? oldRate : ""}<strong>Unpriced</strong></div>`
          : multiRate ? `<div class="period-rate">${oldRate}<strong>€${period.price}</strong></div>` : "";
        const nights = period.days.map((day, dayIndex) => {
          const stop = stopped.has(dayIndex);
          const markup = `<span class="night" data-state="${stop ? "stop" : period.missing ? "missing" : "open"}" style="--night-i:${Math.min(nightIndex++, 14)}" title="${period.dates} · night ${day}: ${period.missing ? "not priced" : `€${period.price}/night${stop ? " · stop sale" : ""}`}">${day}${stop ? `<i class="stop-mark" aria-label="stop sale">×</i>` : ""}</span>`;
          return markup;
        }).join("");
        const periodLabel = `${period.dates}, ${period.days.length} nights, ${period.price == null ? "not priced" : `€${period.price} per night`}`;
        return `<article class="rate-period" aria-label="${periodLabel}" data-period="${Math.min(periodIndex + 1,4)}" data-single="${!multiSegment}" data-single-discount="${singleDiscount}" data-discount="${Boolean(period.discount)}" data-missing="${Boolean(period.missing)}" style="--span:${period.days.length};--i:${periodIndex}"><div class="period-head">${periodAxis}${rate}${terms ? `<div class="period-terms">${terms}</div>` : ""}</div><div class="night-line" style="--span:${period.days.length}">${nights}</div></article>`;
      }).join("");
      const rateMarker = multiRate
        ? `<span class="rate-unit-mark" aria-label="Rates shown per night">${icons.rates}<span>€/N</span></span>`
        : icons.rates;
      return `<section class="rate-map" aria-label="Nightly price schedule" data-scrollable="false">${rateMarker}<div class="rate-scroll"><div class="rate-band">${periods}</div></div><div class="rate-scroll-indicator" aria-hidden="true" hidden><span class="rate-scroll-thumb"></span></div></section>`;
    }

    function groupSignals(signals) {
      return signals.reduce((groups, signal) => {
        (groups[signal.kind] ||= []).push(signal);
        return groups;
      }, {});
    }

    function renderSignalGroups(signals) {
      const groups = groupSignals(signals);
      return Object.entries(groupMeta).filter(([kind]) => groups[kind]?.length).map(([kind, meta]) => `<section style="--group-color:${meta.color};--group-soft:${meta.soft}"><div class="group-head"><span class="group-title">${meta.label}</span><span class="group-count">${groups[kind].length}</span></div>${groups[kind].map(signal => {
        const chips = signal.chips?.length ? `<span class="signal-chips">${signal.chips.map(chip => `<span class="signal-chip">${chip}</span>`).join("")}</span>` : "";
        return `<div class="signal-item"><span class="signal-symbol" aria-hidden="true">${meta.symbol}</span><div><b>${signal.title}</b>${signal.text ? ` <span>· ${signal.text}</span>` : ""}${chips}</div></div>`;
      }).join("")}</section>`).join("");
    }

    function renderSignals(data) {
      const signals = canonicalSignals(data);
      if (!signals.length) return { summary: "", drawer: "" };
      const primaryIndex = signals.findIndex(signal => signal.kind === "blocked" || signal.kind === "action");
      const primary = primaryIndex >= 0 ? signals[primaryIndex] : null;
      const drawerSignals = primary ? signals.filter((_, index) => index !== primaryIndex) : signals;
      const summary = primary
        ? `<div class="signal-copy"><span class="signal-label">Do first</span><b class="signal-title">${primary.title}</b>${primary.text ? `<span class="signal-text">${primary.text}</span>` : ""}</div>`
        : `<div class="signal-copy"><b class="signal-title">Notes</b></div>`;
      const button = drawerSignals.length ? `<button class="review-button" type="button" aria-expanded="false" aria-label="Review ${drawerSignals.length} more alerts">+${drawerSignals.length}</button>` : "";
      const drawer = drawerSignals.length ? `<div class="signal-drawer" data-open="false" aria-hidden="true"><div class="drawer-clip"><div class="drawer-scroll"><div class="signal-groups">${renderSignalGroups(drawerSignals)}</div></div></div></div>` : "";
      return { summary: `<section class="signal-zone"><div class="signal-summary">${summary}${button}</div></section>`, drawer };
    }

    function buildCopyText(data) {
      const lines = [data.copyHotel || data.hotel, data.room, data.party].filter(Boolean);
      data.periods.forEach(period => {
        lines.push(`${period.dates}: ${period.price == null ? "not priced" : `€${period.price}/night${period.discount ? ` after ${period.discount}% ${period.rule}` : ""}`}`);
        if (period.stopDays?.length) lines.push(`Stop sale: ${period.stopDays.length} nights require supplier review.`);
      });
      return lines.join("\n");
    }

    function renderDock(data) {
      const dock = data.dock;
      const pricedPeriods = data.periods.filter(period => period.price != null);
      const multiRate = pricedPeriods.length > 1;
      const singleDiscount = data.periods.length === 1 && Boolean(pricedPeriods[0]?.discount);
      const rateCount = new Set(pricedPeriods.map(period => period.price)).size;
      const margin = data.privateMargin ? `<button class="management-toggle" type="button" aria-expanded="false">Margin</button><div class="management-panel" data-open="false" aria-hidden="true"><div class="management-clip"><div class="margin-row"><div><span>Cost</span><b>${data.privateMargin.cost}</b></div><div><span>Sell</span><b>${data.privateMargin.sell}</b></div><div><span>Profit</span><b>${data.privateMargin.profit}</b></div></div></div></div>` : "";
      const oldPrice = !singleDiscount && dock.old ? `<span class="dock-old-inline"><span>was</span><s>${dock.old}</s><i aria-hidden="true">→</i></span>` : "";
      const discount = !singleDiscount && dock.discount ? `<span class="dock-discount" aria-label="${dock.discount.value} discount, rule ${dock.discount.rule}"><strong>${dock.discount.value}</strong><small>${dock.discount.rule}</small></span>` : "";
      const pricing = multiRate
        ? `<span class="dock-segments" aria-label="${rateCount} nightly rates">${icons.rates}<strong>${rateCount}</strong><span>rates</span></span>`
        : `<div class="dock-value"><div class="dock-price-stack">${oldPrice}<span class="dock-current"><strong>${dock.value}</strong>${dock.unit ? `<span>${dock.unit}</span>` : ""}</span></div>${discount}</div>${dock.range ? `<p class="dock-range">${dock.range}</p>` : ""}`;
      return `<aside class="quote-dock" data-rate-mode="${multiRate ? "segments" : "single"}"><div class="dock-summary"><div class="dock-meta">${!multiRate && dock.label ? `<span class="dock-label">${dock.label}</span>` : ""}<span class="dock-coverage">${icons.night}<span>${dock.coverage}</span></span>${multiRate ? pricing : ""}</div>${multiRate ? "" : pricing}${dock.base ? `<p class="dock-base">${dock.base}</p>` : ""}${margin}</div><div class="dock-actions"><button class="copy-button" type="button" data-copy="${encodeURIComponent(buildCopyText(data))}">${icons.copy}<span>${data.cta}</span></button><div class="tool-row"><button class="tool-button" type="button">${icons.details}<span>Details</span></button><button class="tool-button" type="button">${icons.calc}<span>Calc</span></button><button class="tool-button" type="button">${icons.file}<span>Contract</span></button><button class="tool-button" type="button">${icons.file}<span>SPO</span></button></div></div></aside>`;
    }

    function renderCard(data) {
      const signals = renderSignals(data);
      const occupancyCount = Math.max(1, Math.min(partySize(data.party), 8));
      const quietState = data.state === "Ready";
      const partyDisplay = data.partyShort || data.party;
      const primaryName = data.identityMode === "hotel" ? data.hotel : data.room;
      const secondaryName = data.identityMode === "hotel" ? data.room : data.hotel;
      return `<article class="result-card" data-tone="${data.tone}" data-period-count="${data.periods.length}" data-has-discount="${data.periods.some(period => period.discount)}"><div class="card-main"><header class="result-head"><div class="identity" data-quiet="${quietState}"><div class="identity-heading" data-quiet="${quietState}"><div class="status-line" aria-label="${data.state}"><span class="state-beacon" aria-hidden="true">${data.stateMark}</span>${quietState ? "" : `<span class="status-word">${data.state}</span>`}</div><div class="title-copy">${secondaryName ? `<span class="hotel-name">${secondaryName}</span>` : ""}<h2 class="room-name">${primaryName}</h2></div></div><div class="tag-row">${data.tags.map(tagMarkup).join("")}</div></div><div class="occupancy">${icons.occupancy(occupancyCount)}<div class="occupancy-copy">${data.occupancyLabel ? `<span class="occupancy-label">${data.occupancyLabel}</span>` : ""}<span class="party" aria-label="${data.party}">${partyDisplay}<i class="factor">${icons.factor}<span>${data.factor}</span></i></span>${data.pricedParty ? `<span class="priced-party">${data.pricedParty}</span>` : ""}</div></div></header>${renderRateMap(data)}${signals.summary}</div>${renderDock(data)}${signals.drawer}</article>`;

    let releaseRateScroll = () => {};

    function bindRateScroll() {
      releaseRateScroll();
      const rateMap = preview.querySelector(".rate-map");
      const rateScroll = rateMap?.querySelector(".rate-scroll");
      const rateBand = rateMap?.querySelector(".rate-band");
      const indicator = rateMap?.querySelector(".rate-scroll-indicator");
      const thumb = rateMap?.querySelector(".rate-scroll-thumb");
      if (!rateMap || !rateScroll || !rateBand || !indicator || !thumb) return;

      let animationFrame = 0;
      const update = () => {
        animationFrame = 0;
        const periods = [...rateBand.querySelectorAll(".rate-period")];
        const contentWidth = Math.max(rateBand.clientWidth, ...periods.map(period => period.offsetLeft + period.offsetWidth));
        const layoutOverflow = contentWidth - rateScroll.clientWidth;
        const scrollable = layoutOverflow > 8;
        rateMap.dataset.scrollable = String(scrollable);
        indicator.hidden = !scrollable;

        if (!scrollable) {
          rateScroll.scrollLeft = 0;
          rateScroll.removeAttribute("tabindex");
          rateScroll.removeAttribute("aria-label");
          thumb.style.setProperty("--thumb-width", "100%");
          thumb.style.setProperty("--thumb-offset", "0px");
          return;
        }

        rateScroll.tabIndex = 0;
        rateScroll.setAttribute("aria-label", "Scroll nightly rate periods");
        const trackWidth = indicator.clientWidth;
        const thumbWidth = Math.max(32, trackWidth * (rateScroll.clientWidth / rateScroll.scrollWidth));
        const scrollRange = rateScroll.scrollWidth - rateScroll.clientWidth;
        const progress = scrollRange ? rateScroll.scrollLeft / scrollRange : 0;
        thumb.style.setProperty("--thumb-width", `${thumbWidth}px`);
        thumb.style.setProperty("--thumb-offset", `${Math.max(0, trackWidth - thumbWidth) * progress}px`);
      };
      const scheduleUpdate = () => {
        if (animationFrame) return;
        animationFrame = window.requestAnimationFrame(update);
      };

      rateScroll.addEventListener("scroll", scheduleUpdate, { passive: true });
      window.addEventListener("resize", scheduleUpdate, { passive: true });
      const observer = typeof ResizeObserver === "function" ? new ResizeObserver(scheduleUpdate) : null;
      observer?.observe(rateScroll);
      releaseRateScroll = () => {
        if (animationFrame) window.cancelAnimationFrame(animationFrame);
        rateScroll.removeEventListener("scroll", scheduleUpdate);
        window.removeEventListener("resize", scheduleUpdate);
        observer?.disconnect();
      };
      scheduleUpdate();
    }

    function bindCard() {
      const review = preview.querySelector(".review-button");
      const drawer = preview.querySelector(".signal-drawer");
      if (review) {
        const closedText = review.textContent;
        review.addEventListener("click", () => {
          const open = drawer.dataset.open !== "true";
          drawer.dataset.open = String(open);
          drawer.setAttribute("aria-hidden", String(!open));
          review.setAttribute("aria-expanded", String(open));
          review.textContent = open ? "Close" : closedText;
          review.setAttribute("aria-label", open ? "Close alerts" : `Review ${closedText.slice(1)} more alerts`);
        });
      }

      const management = preview.querySelector(".management-toggle");
      const panel = preview.querySelector(".management-panel");
      if (management) {
        management.addEventListener("click", () => {
          const open = panel.dataset.open !== "true";
          panel.dataset.open = String(open);
          panel.setAttribute("aria-hidden", String(!open));
          management.setAttribute("aria-expanded", String(open));
          management.textContent = open ? "Close margin" : "Margin";
        });
      }

      const copy = preview.querySelector(".copy-button");
      const copyLabel = copy.querySelector("span");
      const original = copyLabel.textContent;
      copy.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(decodeURIComponent(copy.dataset.copy));
          copy.dataset.copied = "true";
          copyLabel.textContent = "Copied";
        } catch {
          copyLabel.textContent = "Preview only";
        }
        window.setTimeout(() => {
          copy.dataset.copied = "false";
          copyLabel.textContent = original;
        }, 1400);
      });
      bindRateScroll();
    }

    function selectScenario(index, focus = false) {
      const scenario = scenarios[index];
      preview.innerHTML = `${renderSetContext(scenario.context)}${renderCard(scenario.data)}`;
      scenarioCount.textContent = `${String(index + 1).padStart(2,"0")} / ${String(scenarios.length).padStart(2,"0")}`;
      [...scenarioList.children].forEach((button, buttonIndex) => {
        const selected = buttonIndex === index;
        button.setAttribute("aria-pressed", String(selected));
        button.tabIndex = selected ? 0 : -1;
      });
      if (focus) scenarioList.children[index].focus();
      bindCard();
    }

    scenarios.forEach((scenario, index) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "scenario";
      button.setAttribute("aria-pressed", index === 0 ? "true" : "false");
      button.tabIndex = index === 0 ? 0 : -1;
      button.innerHTML = `<span class="scenario__number">${index + 1}</span><span>${scenario.name}</span>`;
      button.addEventListener("click", () => selectScenario(index));
      button.addEventListener("keydown", event => {
        if (!["ArrowRight","ArrowLeft","Home","End"].includes(event.key)) return;
        event.preventDefault();
        let next = index;
        if (event.key === "ArrowRight") next = (index + 1) % scenarios.length;
        if (event.key === "ArrowLeft") next = (index - 1 + scenarios.length) % scenarios.length;
        if (event.key === "Home") next = 0;
        if (event.key === "End") next = scenarios.length - 1;
        selectScenario(next, true);
      });
      scenarioList.appendChild(button);
    });

    caseTotal.textContent = `${scenarios.length} cases`;
    selectScenario(0);
  </script>
</body>
</html>
